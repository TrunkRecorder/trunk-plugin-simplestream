[package]
name = "simplestream"
version = "0.1.0"
edition = "2021"
description = "Streams the audio of calls as they're recorded to other programs, over UDP or TCP."
license = "GPL-3.0-or-later"
repository = "https://github.com/TrunkRecorder/trunk-plugin-simplestream"
authors = ["Luke Berndt <lukekb@gmail.com>"]
publish = false

[dependencies]
trunk-recorder-plugin = "0.1"
schemars = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
strip = true
lto = true
